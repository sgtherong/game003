<!-- 첫 화면: 스크립트를 읽는 동안 로고만 보여 주고, 첫 프레임이 그려지면 사라진다(app.js) -->
<div class="splash" id="splash" aria-hidden="true"><div class="logo"><div class="logo-mascot"><i></i></div><svg class="logo-svg" viewBox="0 0 310 124" aria-hidden="true"><g class="lw" style="--i:0"><path class="lw-sh" d="M24 18V86M24 18H42a16 16 0 0 1 0 32H24M24 50H46a18 18 0 0 1 0 36H24"/><path class="lw-ol" d="M24 18V86M24 18H42a16 16 0 0 1 0 32H24M24 50H46a18 18 0 0 1 0 36H24"/><path class="lw-fi" d="M24 18V86M24 18H42a16 16 0 0 1 0 32H24M24 50H46a18 18 0 0 1 0 36H24"/><path class="lw-hi" d="M24 18V86M24 18H42a16 16 0 0 1 0 32H24M24 50H46a18 18 0 0 1 0 36H24"/></g><g class="lw" style="--i:1"><path class="lw-sh" d="M95 46a20 20 0 1 0 0.01 0"/><path class="lw-ol" d="M95 46a20 20 0 1 0 0.01 0"/><path class="lw-fi" d="M95 46a20 20 0 1 0 0.01 0"/><path class="lw-hi" d="M95 46a20 20 0 1 0 0.01 0"/></g><g class="lw" style="--i:2"><path class="lw-sh" d="M134 46V86M134 22v0.01"/><path class="lw-ol" d="M134 46V86M134 22v0.01"/><path class="lw-fi" d="M134 46V86M134 22v0.01"/><path class="lw-hi" d="M134 46V86M134 22v0.01"/></g><g class="lw" style="--i:3"><path class="lw-sh" d="M160 86V46M160 64a18 18 0 0 1 36 0V86"/><path class="lw-ol" d="M160 86V46M160 64a18 18 0 0 1 36 0V86"/><path class="lw-fi" d="M160 86V46M160 64a18 18 0 0 1 36 0V86"/><path class="lw-hi" d="M160 86V46M160 64a18 18 0 0 1 36 0V86"/></g><g class="lw" style="--i:4"><path class="lw-sh" d="M233 46a20 20 0 1 0 0.01 0M253 46V88a20 20 0 0 1 -37 10"/><path class="lw-ol" d="M233 46a20 20 0 1 0 0.01 0M253 46V88a20 20 0 0 1 -37 10"/><path class="lw-fi" d="M233 46a20 20 0 1 0 0.01 0M253 46V88a20 20 0 0 1 -37 10"/><path class="lw-hi" d="M233 46a20 20 0 1 0 0.01 0M253 46V88a20 20 0 0 1 -37 10"/></g><g class="lw" style="--i:5"><path class="lw-sh" d="M282 18V62M282 86v0.01"/><path class="lw-ol" d="M282 18V62M282 86v0.01"/><path class="lw-fi" d="M282 18V62M282 86v0.01"/><path class="lw-hi" d="M282 18V62M282 86v0.01"/></g></svg></div></div>
<main class="app" id="app">
  <section class="stage" id="stage">
    <canvas id="canvas" role="img"></canvas>
    <div class="xpbar" id="xpbar" hidden><i id="xpfill"></i></div>
    <!-- 이 선이 세계 좌표 y=0(앞쪽 시야의 끝). 그 위는 HUD 자리이며 장애물은 흐리게만 보인다 -->
    <div class="world-anchor" id="world-anchor" aria-hidden="true"></div>

    <header class="hud" aria-live="off">
      <div class="hud-score">
        <div class="hud-height"><span id="hud-height">0</span><small>m</small></div>
        <div class="hud-gates" id="hud-gates">0개 통과</div>
      </div>
      <div class="top-right">
        <div class="best-chip" id="best-chip" title="이 기기에 저장된 기록"><span class="best-label" id="best-label">터치 최고</span><span class="best-value" id="best-value">0<small>m</small></span></div>
        <button type="button" class="icon-btn" id="pause-btn" aria-label="일시정지" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <button type="button" class="icon-btn gear" id="settings-btn" aria-label="설정">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.4 7.4 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
        </button>
      </div>
    </header>

    <div class="coach" id="coach" hidden>
      <div class="coach-dots" id="coach-dots"></div>
      <div class="coach-title" id="coach-title"></div>
      <div class="coach-hint" id="coach-hint"></div>
    </div>

    <!-- 하단 조작 안내: 화면 전체가 터치 영역이고, 이 묶음은 보여 주기만 한다(터치는 캔버스로 통과) -->
    <div class="controls">
      <div class="meter-wrap">
        <div class="meter-head"><span id="meter-label">압축 에너지</span><span class="meter-pct" id="meter-pct">0%</span></div>
        <div class="meter" id="meter" role="progressbar" aria-label="압축 에너지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="meter-fill" id="meter-fill"></div>
          <div class="meter-mark" style="left:75%"></div>
          <div class="meter-goal" id="meter-goal" hidden></div>
        </div>
      </div>
      <button type="button" class="pad" id="pad" aria-pressed="false" tabindex="-1">
        <svg class="pad-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="pad-label" id="pad-label">누른 채 좌우로 드래그</span>
        <svg class="pad-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <p class="note" id="note" aria-live="polite"></p>
    </div>

    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* 등록 실패해도 게임은 그대로 */ });
