<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6ece0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1626" media="(prefers-color-scheme: dark)">
<title>꾹!</title>
<!-- 링크 미리보기(카카오톡·메신저·SNS). 호스팅 주소가 바뀌면 아래 절대 주소를 함께 바꾼다. -->
<meta name="description" content="누르면 작아지고, 떼면 튀어 오르는 세로 아케이드. 친구에게 도전장을 보내 같은 코스로 대결해 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="꾹!">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="꾹! — 누르고 튀어 오르기">
<meta property="og:description" content="누르면 작아지고, 떼면 튀어 올라요. 친구에게 도전장을 보내 같은 코스로 대결! 설치 없이 바로 · 무료">
<meta property="og:url" content="https://sgtherong.github.io/game003/web/">
<meta property="og:image" content="https://sgtherong.github.io/game003/web/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="꾹! — 몸을 압축해 좁은 틈을 아슬아슬하게 통과하는 캐릭터">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="꾹! — 누르고 튀어 오르기">
<meta name="twitter:image" content="https://sgtherong.github.io/game003/web/og-image.png">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="꾹!">
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-blob" aria-hidden="true"></span><span class="brand-name">꾹!</span></div>
    <div class="top-right">
      <div class="best-chip" id="best-chip" title="이 기기에 저장된 기록"><span class="best-label" id="best-label">터치 최고</span><span class="best-value" id="best-value">0<small>m</small></span></div>
      <button type="button" class="icon-btn small" id="settings-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.4 7.4 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
      </button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="canvas" role="img"></canvas>
    <div class="xpbar" id="xpbar" hidden><i id="xpfill"></i></div>

    <div class="hud" aria-live="off">
      <div class="hud-score">
        <div class="hud-height"><span id="hud-height">0</span><small>m</small></div>
        <div class="hud-gates" id="hud-gates">0개 통과</div>
      </div>
      <button type="button" class="icon-btn" id="pause-btn" aria-label="일시정지" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
    </div>

    <div class="coach" id="coach" hidden>
      <div class="coach-dots" id="coach-dots"></div>
      <div class="coach-title" id="coach-title"></div>
      <div class="coach-hint" id="coach-hint"></div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </section>

  <section class="meter-wrap">
    <div class="meter-head"><span id="meter-label">압축 에너지</span><span class="meter-pct" id="meter-pct">0%</span></div>
    <div class="meter" id="meter" role="progressbar" aria-label="압축 에너지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="meter-fill" id="meter-fill"></div>
      <div class="meter-mark" style="left:75%"></div>
      <div class="meter-goal" id="meter-goal" hidden></div>
    </div>
  </section>

  <button type="button" class="pad" id="pad" aria-pressed="false">
    <svg class="pad-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span class="pad-label" id="pad-label">누른 채 좌우로 드래그</span>
    <svg class="pad-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <p class="note" id="note" aria-live="polite"></p>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>

<!-- 규칙 모듈(엔진 독립) -->
<script src="../src/balance-r1.js"></script>
<script src="../src/rng.js"></script>
<script src="../src/collision.js"></script>
<script src="../src/generator.js"></script>
<script src="../src/simulation.js"></script>
<script src="../src/input-adapter.js"></script>
<script src="../src/replay.js"></script>
<script src="../src/save.js"></script>
<script src="../src/tutorial.js"></script>
<script src="../src/growth.js"></script>
<script src="../src/feats.js"></script>
<script src="../src/missions.js"></script>
<script src="../src/challenge.js"></script>
<script src="../src/game-controller.js"></script>
<!-- 웹 어댑터 -->
<script src="strings.ko.js"></script>
<script src="strings.en.js"></script>
<script src="audio.js"></script>
<script src="skins.js"></script>
<script src="view.js"></script>
<script src="app.js"></script>
<script>
// 오프라인 실행용 서비스 워커(https 또는 localhost에서만 동작)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* 등록 실패해도 게임은 그대로 */ });
}
</script>
</body>
</html>
