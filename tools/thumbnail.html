<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Boing! 썸네일</title>
<!-- 공유 미리보기 이미지(1200×630) 원본. node tools/make-thumbnail.js 가 이 페이지를 찍어 web/og-image.png 로 저장한다.
     글자를 넣지 않는다: 미리보기는 받는 사람의 언어와 상관없이 하나이므로 그림만으로 전한다(제목·설명은 meta 태그가 담당). -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script src="../web/skins.js"></script>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1200, H = 630;
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  // ── 배경: 노을 하늘 ──
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#ff9a78'); bg.addColorStop(0.55, '#ffc89a'); bg.addColorStop(1, '#fff0dc');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // 해
  var sg = ctx.createRadialGradient(980, 150, 10, 980, 150, 220);
  sg.addColorStop(0, 'rgba(255,236,170,0.95)'); sg.addColorStop(0.25, 'rgba(255,224,150,0.55)'); sg.addColorStop(1, 'rgba(255,224,150,0)');
  ctx.fillStyle = sg; ctx.fillRect(700, 0, 500, 420);
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(980, 150, 56, 0, Math.PI * 2); ctx.fill();
  // 빛망울
  [[120, 520, 60], [560, 90, 40], [1120, 470, 70], [430, 560, 34]].forEach(function (b) {
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.arc(b[0], b[1], b[2], 0, Math.PI * 2); ctx.fill();
  });
  // 양옆 절벽
  function cliff(side, base, color, seed) {
    ctx.fillStyle = color; ctx.beginPath();
    var ex = side < 0 ? 0 : W; ctx.moveTo(ex, -10);
    for (var y = -10; y <= H + 10; y += 12) {
      var w = base + Math.sin(y * 0.018 + seed) * 22 + Math.sin(y * 0.05 + seed * 2) * 10;
      ctx.lineTo(side < 0 ? w : W - w, y);
    }
    ctx.lineTo(ex, H + 10); ctx.closePath(); ctx.fill();
  }
  cliff(1, 70, 'rgba(233,143,138,0.45)', 1.2);
  cliff(1, 34, 'rgba(201,101,121,0.65)', 3.1);
  cliff(-1, 26, 'rgba(201,101,121,0.45)', 0.4);

  // ── 오른쪽: 게임 장면 ──
  var sx = 690, sw = 420, cx = sx + sw / 2;
  // 바람 줄기
  ctx.lineCap = 'round';
  for (var i = 0; i < 16; i++) {
    var x = sx + 20 + ((i * 53.7) % (sw - 40)), y0 = (i * 97.3) % 560, len = 50 + (i % 4) * 26;
    var g = ctx.createLinearGradient(0, y0, 0, y0 + len);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.55)');
    ctx.strokeStyle = g; ctx.lineWidth = 2 + (i % 3);
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + len); ctx.stroke();
  }
  // 벽(틈 사이를 아슬아슬하게 통과 중)
  function wall(y, h, gapC, gap) {
    var l = gapC - gap / 2, r = gapC + gap / 2;
    var beam = ctx.createLinearGradient(0, y - 60, 0, y + h + 60);
    beam.addColorStop(0, 'rgba(255,214,122,0)'); beam.addColorStop(0.5, 'rgba(255,214,122,0.35)'); beam.addColorStop(1, 'rgba(255,214,122,0)');
    ctx.fillStyle = beam; ctx.fillRect(l, y - 60, gap, h + 120);
    [[sx - 30, l - (sx - 30)], [r, sx + sw + 30 - r]].forEach(function (s, k) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(s[0], y + 8, s[1], h, 12); ctx.fill();
      var wg = ctx.createLinearGradient(0, y, 0, y + h);
      wg.addColorStop(0, '#5a4a74'); wg.addColorStop(0.4, '#3a2f4f'); wg.addColorStop(1, '#241c36');
      ctx.fillStyle = wg; rr(s[0], y, s[1], h, 12); ctx.fill();
      ctx.save(); rr(s[0], y, s[1], h, 12); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 4;
      for (var q = s[0] - h; q < s[0] + s[1]; q += 20) { ctx.beginPath(); ctx.moveTo(q, y + h); ctx.lineTo(q + h, y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(s[0], y, s[1], 3);
      ctx.restore();
    });
    ctx.save(); ctx.shadowColor = '#ffd27a'; ctx.shadowBlur = 22; ctx.fillStyle = '#ffd27a';
    rr(l - 7, y + 6, 6, h - 12, 3); ctx.fill(); rr(r + 1, y + 6, 6, h - 12, 3); ctx.fill(); ctx.restore();
  }
  wall(90, 44, cx + 40, 150);
  wall(300, 52, cx, 108);

  // 캐릭터(게임과 같은 그림 코드) — 압축해서 틈을 지나는 순간
  var px = cx, py = 330, pr = 46;
  var halo = ctx.createRadialGradient(px, py, pr * 0.5, px, py, pr * 2.2);
  halo.addColorStop(0, 'rgba(255,118,88,0.45)'); halo.addColorStop(1, 'rgba(255,118,88,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(px, py, pr * 2.2, 0, Math.PI * 2); ctx.fill();
  // 잔상
  for (var t = 1; t <= 4; t++) { ctx.fillStyle = 'rgba(255,118,88,' + (0.16 - t * 0.03) + ')'; ctx.beginPath(); ctx.arc(px, py + t * 18, pr * (1 - t * 0.04), 0, Math.PI * 2); ctx.fill(); }
  KKUK.Skins.paint('base', { ctx: ctx, x: px, y: py, r: pr, held: true, energy: 0.55, dead: false, danger: 0, now: 0, wob: 0, phase: 0, look: 0, blink: false, expanded: false });
  // 예상 반동 링
  ctx.strokeStyle = 'rgba(255,118,88,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([8, 10]);
  ctx.beginPath(); ctx.arc(px, py, 84, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  // 아슬아슬 반짝임(틈 가장자리)
  sparkle(px + 104, py - 58, 26, '#ffd34d'); sparkle(px + 140, py - 20, 14, '#fff3c4'); sparkle(px - 108, py - 40, 16, '#ffd34d');

  // 아래쪽 스킨들
  var skins = ['slime', 'strawberry', 'bee', 'panda', 'galaxy', 'gold'];
  skins.forEach(function (id, i) {
    var x = sx + 52 + i * 63, y = 545, r = 24;
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.fill();
    KKUK.Skins.paint(id, { ctx: ctx, x: x, y: y, r: r, held: false, energy: 0, dead: false, danger: 0, now: 0, wob: 0, phase: 0, look: 0, blink: false, expanded: false });
  });

  // ── 왼쪽: 그림만 (?v=challenge 이면 도전장 카드용) ──
  var challenge = /[?&]v=challenge/.test(location.search);
  function ball(id, x, y, r, st) {
    ctx.fillStyle = 'rgba(60,20,20,0.12)'; ctx.beginPath(); ctx.ellipse(x, y + r + 14, r * 0.8, r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    KKUK.Skins.paint(id, Object.assign({ ctx: ctx, x: x, y: y, r: r, held: false, energy: 0, dead: false, danger: 0, now: 0, wob: 0, phase: 0, look: 0, blink: false, expanded: false }, st || {}));
  }
  function arrow(x0, y0, cx, cy, x1, y1) {
    ctx.strokeStyle = 'rgba(42,22,38,0.55)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.setLineDash([2, 14]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke(); ctx.setLineDash([]);
    var a = Math.atan2(y1 - cy, x1 - cx);
    ctx.fillStyle = 'rgba(42,22,38,0.55)'; ctx.beginPath();
    ctx.moveTo(x1 + Math.cos(a) * 14, y1 + Math.sin(a) * 14);
    ctx.lineTo(x1 + Math.cos(a + 2.4) * 14, y1 + Math.sin(a + 2.4) * 14);
    ctx.lineTo(x1 + Math.cos(a - 2.4) * 14, y1 + Math.sin(a - 2.4) * 14); ctx.closePath(); ctx.fill();
  }
  if (!challenge) {
    // 누르기 → 작아짐 → 떼면 튀어 오름
    ball('base', 140, 360, 62, { look: 1 });
    // 누르는 손가락 자리: 동심원
    [44, 62, 80].forEach(function (rad, i) {
      ctx.strokeStyle = 'rgba(107,92,255,' + (0.75 - i * 0.2) + ')'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(330, 380, rad, 0, Math.PI * 2); ctx.stroke();
    });
    ball('base', 330, 380, 30, { held: true, energy: 0.8 });
    // 떼면 튀어 오름: 위로 솟는 잔상 + 큰 몸
    for (var k = 3; k >= 1; k--) { ctx.fillStyle = 'rgba(255,118,88,' + (0.1 + (3 - k) * 0.05) + ')'; ctx.beginPath(); ctx.arc(520, 210 + k * 46, 70 - k * 9, 0, Math.PI * 2); ctx.fill(); }
    ball('base', 520, 200, 78, { expanded: true, look: -0.3 });
    sparkle(600, 110, 30, '#ffd34d'); sparkle(438, 130, 18, '#fff3c4'); sparkle(612, 268, 16, '#fff3c4');
    arrow(198, 316, 250, 270, 290, 334);
    arrow(372, 340, 410, 270, 448, 246);
  } else {
    // 봉투(빨간 별 봉인) → 두 캐릭터의 맞대결
    ctx.save(); ctx.translate(250, 170); ctx.rotate(-0.08);
    ctx.fillStyle = 'rgba(60,20,20,0.16)'; rr(-150, -88, 300, 190, 18); ctx.fill();
    ctx.fillStyle = '#fff8ee'; rr(-150, -100, 300, 190, 18); ctx.fill();
    ctx.strokeStyle = '#e8cfb4'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-146, -94); ctx.lineTo(0, 12); ctx.lineTo(146, -94); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-146, 84); ctx.lineTo(-40, -10); ctx.moveTo(146, 84); ctx.lineTo(40, -10); ctx.stroke();
    ctx.fillStyle = '#c2364a'; ctx.beginPath(); ctx.arc(0, 12, 34, 0, Math.PI * 2); ctx.fill();
    star(0, 12, 20, '#ffd34d');
    ctx.restore();
    sparkle(420, 70, 26, '#ffd34d'); sparkle(84, 260, 18, '#fff3c4');
    // 맞대결
    ball('base', 150, 450, 70, { look: 1 });
    ball('slime', 470, 450, 70, { look: -1 });
    burst(310, 440, 58, '#ffd34d', '#ff8a3d');
    bolt(310, 440, 40);
  }
  // 4갈래 반짝임
  function sparkle(x, y, s, col) {
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s); ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
    ctx.fill();
  }
  function star(x, y, r, col) {
    ctx.fillStyle = col; ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
    ctx.closePath(); ctx.fill();
  }
  function burst(x, y, r, col, edge) {
    ctx.fillStyle = edge; ctx.beginPath();
    for (var i = 0; i < 24; i++) { var a = i * Math.PI / 12, q = i % 2 ? r * 0.62 : r * 1.08; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath();
    for (var j = 0; j < 24; j++) { var b = j * Math.PI / 12 + 0.13, q2 = j % 2 ? r * 0.5 : r * 0.88; ctx.lineTo(x + Math.cos(b) * q2, y + Math.sin(b) * q2); }
    ctx.closePath(); ctx.fill();
  }
  function bolt(x, y, h) {
    ctx.fillStyle = '#2a1626'; ctx.beginPath();
    ctx.moveTo(x + h * 0.15, y - h); ctx.lineTo(x - h * 0.45, y + h * 0.12); ctx.lineTo(x - h * 0.02, y + h * 0.12);
    ctx.lineTo(x - h * 0.2, y + h); ctx.lineTo(x + h * 0.45, y - h * 0.18); ctx.lineTo(x + h * 0.02, y - h * 0.18); ctx.closePath(); ctx.fill();
  }

  document.title = 'ready';
})();
</script>
</body>
</html>
