<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boing! 도전장</title>
<!-- 도전장 링크(…/c/#코드)의 미리보기. 메신저는 # 뒤를 서버에 보내지 않으므로 모든 도전장이 같은 미리보기를 쓴다.
     누가·몇 m인지는 공유 문구에 들어간다. 호스팅 주소가 바뀌면 아래 절대 주소를 함께 바꾼다. -->
<meta name="description" content="친구가 Boing!에서 도전장을 보냈어요. 같은 코스에서 친구 기록을 넘어 보세요. 설치 없이 바로 · 무료">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boing!">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="Boing! 도전장이 도착했어요">
<meta property="og:description" content="같은 코스에서 친구 기록을 넘어 보세요. 설치 없이 바로 · 무료">
<meta property="og:url" content="https://sgtherong.github.io/game003/c/">
<meta property="og:image" content="https://sgtherong.github.io/game003/web/og-challenge.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Boing! 도전장 도착 — 같은 코스에서 나를 이겨 봐">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Boing! 도전장이 도착했어요">
<meta name="twitter:image" content="https://sgtherong.github.io/game003/web/og-challenge.png">
<!-- 게임으로 이동: '#코드' → 'web/#c=코드', '?c=코드'(카카오 카드 버튼)는 그대로 넘긴다 -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '');
  if (h && !/^c=/.test(h)) h = 'c=' + h;
  location.replace('../web/' + location.search + (h ? '#' + h : ''));
})();
</script>
<style>body{font:16px system-ui,sans-serif;background:#fbf4ea;color:#1d2833;display:grid;place-items:center;min-height:100vh;margin:0}</style>
</head>
<body><a href="../web/">Boing! 도전장 열기</a></body>
</html>
